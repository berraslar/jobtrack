name: Release

# A03 / A08: dağıtılacak imajlar yalnızca CI'da, main dalındaki yeşil commit'ten üretilir;
# SBOM (CycloneDX) eklenir ve Sigstore cosign ile anahtarsız (OIDC) imzalanır.
# Sunucu tarafı yalnızca imzası doğrulanan imajı çalıştırmalıdır (README → Dağıtım).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: İmaj, SBOM ve imza
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # ghcr.io'ya gönderim
      id-token: write # cosign anahtarsız imza (OIDC)
    strategy:
      matrix:
        component: [api, web, cv-parser, backup]
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
          - component: cv-parser
            dockerfile: apps/cv-parser/Dockerfile
          - component: backup
            dockerfile: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmaj adı
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.name.outputs.image }}:main
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json
          upload-artifact: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: İmzala ve SBOM'u imaja bağla
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.component }}.cdx.json" "$IMAGE"
